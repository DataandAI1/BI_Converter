[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tableauforge"
version = "0.1.0"
description = "BI_Converter forge: LLM authoring and spec compilation for Databricks AI/BI dashboards."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Trimmed against the upstream TableauForge list: the Tableau/Power BI compilers, the
# CSV and database profilers, the hyper writer, and the MCP connector are all out of
# scope (spec §3.2), and their dependencies go with them. sqlglot stays — validate/
# lakeview.py uses it to parse emitted dataset SQL, which is load-bearing for the LLM
# lane's honesty guarantees (spec §4.4 coupling 3).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "anthropic>=0.109",  # output_config (effort) + refusal stop-reason handling
    "python-multipart>=0.0.9",
    "httpx>=0.27",  # Ollama provider transport
    "sqlglot>=25.0",  # Databricks SQL parse gate for the .lvdash.json validator
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["tableauforge*"]

[tool.setuptools.package-data]
tableauforge = ["spec/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["tableauforge"]
omit = ["tableauforge/api/*", "tableauforge/llm/*"]
